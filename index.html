<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Han Yang · 杨焓</title>
  <meta name="description" content="个人摄影作品集" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23111' stroke-width='2'/%3E%3Ccircle cx='12' cy='12' r='3.5' fill='%23111'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand">作品集</a>
    <nav class="links">
      <a href="#work" data-i18n="work">作品</a>
      <a href="#about" data-i18n="about">关于</a>
      <button class="text-btn lang-btn" id="lang-toggle" data-i18n="switchLang" data-i18n-title="switchLangTitle">EN</button>
      <button class="icon-btn" id="theme-toggle" data-i18n-label="theme" aria-label="切换主题">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v18A9 9 0 0 0 12 3z" fill="currentColor" stroke="none"/></svg>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 id="site-title">作品集</h1>
      <p id="site-subtitle"></p>
    </section>

    <section id="work" class="work">
      <div class="filters" id="filters" role="tablist" aria-label="按主题筛选"></div>
      <div class="gallery-wrap" id="gallery-wrap">
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <section id="about" class="about">
      <h2 data-i18n="about">关于</h2>
      <p id="site-about"></p>
      <p class="contact" id="site-contact"></p>
    </section>
  </main>

  <footer class="footer">
    <span id="site-copyright"></span>
    <button class="text-btn" id="edit-toggle" title="E" data-i18n="edit">编辑排布</button>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
